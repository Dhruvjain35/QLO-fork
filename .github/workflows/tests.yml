name: tests

on:
  push:
    branches: [main]
  pull_request:

# PYTHONUTF8 is deliberately NOT set: the code must handle UTF-8 itself (Windows defaults to cp1252).
jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the history guard compares against an earlier commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error::DeprecationWarning

  smoke:
    # Each driver's --fast mode with no folder flags: caches and output go to .qlo_cache/<experiment>_fast/,
    # never to results/. The last step fails if any committed file changed.
    name: smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m qlo.experiments.b1_entangling --fast
      - run: python -m qlo.experiments.b2_estimators --fast
      - run: python -m qlo.experiments.b3_hardening --fast
      - run: python -m qlo.experiments.b4_noise --fast
      - name: committed files unchanged, smoke output ignored
        shell: bash
        run: |
          git diff --exit-code --stat
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
